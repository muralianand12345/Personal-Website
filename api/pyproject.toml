[project]
name = "api"
version = "1.0.0"
description = "FastAPI backend for LLM interactions with improved architecture"
authors = [
    {name = "Murali Anand", email = "71955467+muralianand12345@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
package-mode = false
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.8,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.10.6,<3.0.0",
    "pydantic-settings>=2.7.1,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "groq>=0.18.0,<0.19.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "transformers>=4.48.3,<5.0.0",
    "torch>=2.6.0,<3.0.0",
    "numpy>=2.2.2,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true